<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mona Asrani · Digital Card</title>
<meta name="theme-color" content="#131210">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {--charcoal:#131210; --charcoal-soft:#1d1b17; --gold:#c9a35c; --gold-soft:#a88a48; --gold-bright:#d9b26a; --cream:#ede4d3; --cream-dim:#8a8270;}
  * {margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body {font-family:'Cormorant Garamond',serif; background:var(--charcoal); color:var(--cream); min-height:100vh; -webkit-font-smoothing:antialiased;}
  body {background-image:radial-gradient(ellipse at 50% 0%, rgba(201,163,92,0.08), transparent 60%); padding:48px 24px 60px; max-width:480px; margin:0 auto;}
  body::before {content:""; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.85 0 0 0 0 0.72 0 0 0 0 0.45 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E"); opacity:0.6; pointer-events:none; mix-blend-mode:overlay; z-index:0;}
  .wrap {position:relative; z-index:1;}
  header {text-align:center; margin-bottom:36px;}
  .photo-frame {width:108px; height:138px; margin:0 auto 18px; position:relative; overflow:hidden; border:0.5px solid rgba(201,163,92,0.55); box-shadow:0 0 0 4px rgba(201,163,92,0.06); border-radius:2px;}
  .photo-frame img {width:100%; height:100%; object-fit:cover; object-position:50% 22%; display:block; filter:saturate(0.94) contrast(1.03) brightness(0.97);}
  .name {font-style:italic; font-weight:500; font-size:42px; line-height:0.95; color:var(--cream); margin-bottom:14px;}
  .rule {width:32px; height:1px; background:var(--gold); margin:0 auto 14px;}
  .title {font-size:11px; letter-spacing:0.32em; text-transform:uppercase; color:var(--gold); line-height:1.6;}
  .place {font-size:13px; font-style:italic; color:var(--cream); letter-spacing:0.04em; margin-top:10px;}
  .btn {display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px 20px; border-radius:2px; font-family:'Cormorant Garamond',serif; font-size:16px; letter-spacing:0.04em; text-decoration:none; cursor:pointer; border:none; transition:transform 0.15s ease, opacity 0.15s ease;}
  .btn:active {transform:scale(0.98); opacity:0.92;}
  .btn-primary {background:var(--gold); color:var(--charcoal); font-weight:500;}
  .btn-secondary {background:transparent; color:var(--cream); border:0.5px solid rgba(201,163,92,0.45); font-weight:400;}
  .btn svg {width:18px; height:18px;}
  .input-row {margin:18px 0 10px;}
  .input-row label {display:block; font-size:10px; letter-spacing:0.32em; text-transform:uppercase; color:var(--cream-dim); margin-bottom:8px;}
  .name-input {width:100%; padding:13px 16px; background:var(--charcoal-soft); border:0.5px solid rgba(201,163,92,0.25); border-radius:2px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16px; color:var(--cream); letter-spacing:0.02em;}
  .name-input:focus {outline:none; border-color:var(--gold);}
  .name-input::placeholder {color:var(--cream-dim); opacity:0.7;}
  .section {margin:24px 0;}
  .divider {display:flex; align-items:center; gap:14px; margin:32px 0; color:var(--cream-dim);}
  .divider::before, .divider::after {content:""; flex:1; height:0.5px; background:rgba(237,228,211,0.15);}
  .divider span {font-size:10px; letter-spacing:0.4em; text-transform:uppercase; font-style:italic;}
  .links {display:flex; flex-direction:column; gap:2px;}
  .link {display:flex; align-items:center; gap:14px; padding:14px 4px; color:var(--cream); text-decoration:none; border-bottom:0.5px solid rgba(237,228,211,0.08); transition:background 0.15s ease;}
  .link:last-child {border-bottom:none;}
  .link:active {background:rgba(201,163,92,0.06);}
  .link .icon {width:18px; height:18px; color:var(--gold); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .link .value {font-size:15px; letter-spacing:0.02em; color:var(--cream); flex:1; word-break:break-word;}
  footer {text-align:center; margin-top:48px; font-style:italic; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cream-dim); opacity:0.6;}
</style></head><body>
